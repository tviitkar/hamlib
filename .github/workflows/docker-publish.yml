name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-publish.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Hamlib Version from Dockerfile
        id: hamlib
        run: |
          VERSION=$(sed -n 's/^ARG HAMLIB_VERSION=//p' Dockerfile)
          if [ -z "$VERSION" ]; then
            echo "::error::HAMLIB_VERSION not found in Dockerfile"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Hamlib version: ${VERSION}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.hamlib.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }},priority=300
            type=raw,value=${{ steps.hamlib.outputs.version }}-devel,enable=${{ github.ref != 'refs/heads/main' }},priority=300
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.description=Containerized Hamlib suite
            org.opencontainers.image.licenses=MIT AND GPL-2.0-or-later AND GPL-3.0-or-later AND LGPL-2.1-or-later

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          build-args: |
            HAMLIB_VERSION=${{ steps.hamlib.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.title=hamlib
            index:org.opencontainers.image.description=Containerized Hamlib suite
            index:org.opencontainers.image.source=https://github.com/tviitkar/hamlib
            index:org.opencontainers.image.licenses=MIT AND GPL-2.0-or-later AND GPL-3.0-or-later AND LGPL-2.1-or-later
            manifest:org.opencontainers.image.title=hamlib
            manifest:org.opencontainers.image.description=Containerized Hamlib suite
            manifest:org.opencontainers.image.source=https://github.com/tviitkar/hamlib
            manifest:org.opencontainers.image.licenses=MIT AND GPL-2.0-or-later AND GPL-3.0-or-later AND LGPL-2.1-or-later
            manifest-descriptor:org.opencontainers.image.description=Containerized Hamlib suite
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete Devel Tag of Released Version
        if: github.ref == 'refs/heads/main'
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          delete-tags: ${{ steps.hamlib.outputs.version }}-devel
