name: Build and Publish Docker Image

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - 3-track-upstream-hamlib-releases
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-publish.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Upstream Hamlib Release Version
        id: hamlib
        run: |
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/Hamlib/Hamlib/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          CLEAN_TAG=$(echo "$UPSTREAM_TAG" | sed 's/^v//')
          if [ -z "$CLEAN_TAG" ]; then
            CLEAN_TAG="latest"
          fi
          echo "tag=${CLEAN_TAG}" >> $GITHUB_OUTPUT
          echo "Upstream Hamlib release tag: ${CLEAN_TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/3-track-upstream-hamlib-releases' }}
            type=raw,value=${{ steps.hamlib.outputs.tag }},enable=${{ steps.hamlib.outputs.tag != 'latest' }}
          labels: |
            org.opencontainers.image.title=rigctld
            org.opencontainers.image.description=Containerized Hamlib radio control daemon
            org.opencontainers.image.source=https://github.com/tviitkar/rigctld
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=rigctld
            org.opencontainers.image.description=Containerized Hamlib radio control daemon
            org.opencontainers.image.source=https://github.com/tviitkar/rigctld
            org.opencontainers.image.licenses=MIT
            manifest:org.opencontainers.image.description=Containerized Hamlib radio control daemon

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
