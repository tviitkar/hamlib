name: Build and Publish Docker Image

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-publish.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Installed Hamlib Package Version
        id: hamlib
        run: |
          docker build -t temp-build .
          INSTALLED_VERSION=$(docker run --rm temp-build rigctld -V | head -n1 | sed -E 's/.*Hamlib ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [ -z "$INSTALLED_VERSION" ]; then
            INSTALLED_VERSION="latest"
          fi
          echo "tag=${INSTALLED_VERSION}" >> $GITHUB_OUTPUT
          echo "Installed Hamlib package version: ${INSTALLED_VERSION}"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Version Tag Already Exists on GHCR
        id: check_tag
        run: |
          CLEAN_TAG="${{ steps.hamlib.outputs.tag }}"
          if [ "$CLEAN_TAG" = "latest" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Manual trigger or latest tag. Proceeding with build."
            exit 0
          fi

          if docker manifest inspect ghcr.io/${{ github.repository }}:${CLEAN_TAG} >/dev/null 2>&1; then
            echo "Version tag ${CLEAN_TAG} is already published on GHCR."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version tag ${CLEAN_TAG} is NOT published on GHCR yet. Proceeding with build."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        if: steps.check_tag.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_tag.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata
        if: steps.check_tag.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.hamlib.outputs.tag }},enable=${{ steps.hamlib.outputs.tag != 'latest' }}

      - name: Build and Push Multi-Arch Docker Image
        if: steps.check_tag.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.title=hamlib
            index:org.opencontainers.image.description=Containerized Hamlib suite
            index:org.opencontainers.image.source=https://github.com/tviitkar/hamlib
            index:org.opencontainers.image.licenses=MIT
            manifest:org.opencontainers.image.title=hamlib
            manifest:org.opencontainers.image.description=Containerized Hamlib suite
            manifest:org.opencontainers.image.source=https://github.com/tviitkar/hamlib
            manifest:org.opencontainers.image.licenses=MIT
            manifest-descriptor:org.opencontainers.image.description=Containerized Hamlib suite
          cache-from: type=gha
          cache-to: type=gha,mode=max
